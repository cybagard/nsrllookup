# Build/test harness for the single-service model. Builds the API image and
# runs the test suite; no nsrlsvr service. Provisioning the Hash Set volume
# is a one-time operational step, never a build step.
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: nsrllookup-api
    # Mount the provisioned data dir read-only so both rds.db and its
    # Provisioning manifest are visible to boot; the Audit Trail stays
    # read-write and append-only.
    volumes:
      - ./data:/data:ro
      - ./data/audit:/var/log/nsrllookup
    command: python /api/app.py
    ports:
      - 5000:5000
  api-test:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: nsrllookup-api
    volumes:
      - ./data:/data:ro
      - ./data/audit:/var/log/nsrllookup
    command: pytest --cov=. --cov-report=term-missing
