# Single-service model (ADR-0001, ADR-0003): one API container that queries
# the provisioned Minimal Set Hash Set directly from a mounted, read-only
# volume. There is no separate nsrlsvr daemon -- the engine is "open the
# .db and run a query". Provisioning the volume (mount + apply deltas) is a
# one-time operational step done outside build/CI.
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: nsrllookup-api
    # The provisioned data dir carries the queryable rds.db and the
    # Provisioning manifest; mounting it read-only makes both visible to
    # boot, which reports ready iff the manifest agrees with the db. The
    # Audit Trail is mounted read-write so it is durable and append-only.
    volumes:
       - ./data:/data:ro
       - ./data/audit:/var/log/nsrllookup
    command: python /api/app.py
    ports:
       - 5000:5000
