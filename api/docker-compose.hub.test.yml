services:
  svr:
    image: cybagard/nsrllookup-svr:latest
    volumes:
     - ./tests/hashes.txt:/usr/local/share/nsrlsvr/hashes.txt

  sut:
    image: cybagard/nsrllookup-api:latest
    depends_on:
     - svr
    command: pytest --cov=.
    environment:
     - WAIT_HOSTS=svr:9120
     - WAIT_HOSTS_TIMEOUT=300
     - WAIT_SLEEP_INTERVAL=30
     - WAIT_HOST_CONNECT_TIMEOUT=30
