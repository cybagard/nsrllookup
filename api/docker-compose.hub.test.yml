# Single-service test harness: build the API image and run the self-contained
# (fixture-based) test suite inside it. No live server, no separate service --
# the suite drives the app through Flask's test client against the fixture Hash
# Set. This backs the CI test job.
services:
  sut:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m pytest --cov=. --cov-report=term-missing
